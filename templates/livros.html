<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="pagina-interna">

    <nav>
        <a href="{{ url_for('inicio') }}">Início</a>
        |
        <a href="{{ url_for('livros') }}">Livros</a>
        |
        <a href="{{ url_for('usuarios') }}">Usuários</a>
        |
        <a href="{{ url_for('emprestimos') }}">Empréstimos</a>
    </nav>

    <hr>

    <h1>Livros da Biblioteca</h1>

    <h2>Cadastrar novo livro</h2>

    <form method="POST">

        <label>Título:</label>
        <input type="text" name="titulo" required>

        <br><br>

        <label>Autor:</label>
        <input type="text" name="autor" required>

        <br><br>

        <label>Editora:</label>
        <input type="text" name="editora">

        <br><br>

        <label>Ano de publicação:</label>
        <input type="number" name="ano_publicacao">

        <br><br>

        <label>Categoria:</label>
        <input type="text" name="categoria">

        <br><br>

        <label>ISBN:</label>
        <input type="text" name="isbn">

        <br><br>

        <label>Quantidade:</label>
        <input type="number" name="quantidade" required>

        <br><br>

        <button type="submit">Cadastrar livro</button>

    </form>

    <hr>

    <h2>Livros cadastrados</h2>

    {% for livro in livros %}

    <p>
        <strong>{{ livro.titulo }}</strong>
        - {{ livro.autor }}

        <a href="{{ url_for('editar', id=livro.id_livro) }}">
            Editar
        </a>

        <a href="{{ url_for('excluir', id=livro.id_livro) }}"
            onclick="return confirm('Tem certeza que deseja excluir este livro?');">
            Excluir
        </a>
    </p>

{% endfor %}

</body>

</html>

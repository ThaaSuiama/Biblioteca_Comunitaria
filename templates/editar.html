<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Livro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="pagina-interna">

    <header>
        <div class="logo">
            📚 Biblioteca Comunitária
        </div>

        <nav>
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('livros') }}">Livros</a>
            <a href="{{ url_for('usuarios') }}">Usuários</a>
            <a href="{{ url_for('emprestimos') }}">Empréstimos</a>
        </nav>
    </header>

    <main>

        <h1>Editar Livro</h1>

        <form method="POST">

        <label>Título:</label>
        <input type="text" name="titulo" value="{{ livro.titulo }}" required>

        <br><br>

        <label>Autor:</label>
        <input type="text" name="autor" value="{{ livro.autor }}" required>

        <br><br>

        <label>Editora:</label>
        <input type="text" name="editora" value="{{ livro.editora }}">

        <br><br>

        <label>Ano de publicação:</label>
        <input type="number" name="ano_publicacao" value="{{ livro.ano_publicacao }}">

        <br><br>

        <label>Categoria:</label>
        <input type="text" name="categoria" value="{{ livro.categoria }}">

        <br><br>

        <label>ISBN:</label>
        <input type="text" name="isbn" value="{{ livro.isbn }}">

        <br><br>

        <label>Quantidade:</label>
        <input type="number" name="quantidade" value="{{ livro.quantidade }}" required>

        <br><br>

        <button type="submit">Salvar alterações</button>

        <a href="{{ url_for('livros') }}" class="botao-voltar">
            ← Voltar para livros
        </a>

        </form>

    </main>

    <footer>
        <p>Biblioteca Comunitária • Projeto de Atividade Extensionista</p>
    </footer>

</body>
